<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Баай</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* «Баай» — оформление.
   Полярная ночь: тёмно-синий стол, поле цвета наста, серебро и золото якутских украшений.
   Один осознанный тёмный вид, без светлой темы. */
:root {
  --night: #0f1c2e;        /* фон стола */
  --night-2: #172a42;      /* панели */
  --night-3: #22395a;      /* кнопки, рамки */
  --snow: #eef3f7;         /* клетки поля */
  --snow-2: #d9e3ec;       /* углы поля */
  --ink: #142233;          /* текст на клетках */
  --frost: #a9bdd1;        /* второстепенный текст */
  --text: #f2f5f8;         /* основной текст */
  --gold: #e2b44c;         /* акцент: деньги, главная кнопка */
  --gold-ink: #2a1d02;
  --danger: #e2605a;
  --ok: #5fc48a;

  --f-display: "Yeseva One", Georgia, "Times New Roman", serif;
  --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-narrow: "PT Sans Narrow", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, Arial, sans-serif;

  --r: 10px;
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--night); color: var(--text); margin: 0; }
body {
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 24px;
  -webkit-tap-highlight-color: transparent;
}

#app { max-width: 560px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 12px; }

/* ---------- типографика ---------- */
.logo {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: 56px;
  line-height: 1;
  margin: 0;
  color: var(--gold);
  letter-spacing: .02em;
}
.logo.small { font-size: 24px; }
.tagline { margin: 4px 0 0; color: var(--frost); }
.h2 {
  font-family: var(--f-narrow);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--frost);
  margin: 0 0 8px;
  font-weight: 700;
}
.hint { color: var(--frost); font-size: 13px; margin: 8px 0 0; }
.copy { color: var(--frost); font-size: 12px; text-align: center; opacity: .7; margin: 8px 0 0; }

.setup-head { padding-block: 24px 8px; text-align: center; }
/* полоска орнамента под логотипом */
.setup-head::after {
  content: "";
  display: block;
  height: 10px;
  margin: 16px auto 0;
  width: 220px;
  background:
    linear-gradient(135deg, transparent 33%, var(--gold) 33% 50%, transparent 50% 83%, var(--gold) 83%) 0 0 / 20px 10px,
    linear-gradient(45deg, transparent 33%, var(--gold) 33% 50%, transparent 50% 83%, var(--gold) 83%) 10px 0 / 20px 10px;
  opacity: .8;
}

/* ---------- панели и кнопки ---------- */
.panel {
  background: var(--night-2);
  border-radius: var(--r);
  padding: 14px;
}
.panel p { margin: 0 0 10px; }

.btn {
  font: inherit;
  font-weight: 700;
  border: 0;
  border-radius: 8px;
  padding: 11px 14px;
  min-height: 44px;
  background: var(--night-3);
  color: var(--text);
  cursor: pointer;
}
.btn:focus-visible, .seg button:focus-visible, .cell:focus-visible, input:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: var(--gold-ink); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; color: var(--frost); min-height: 36px; padding: 6px 10px; }
.btn.big { font-size: 18px; min-height: 54px; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 14px; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 0;
  min-width: 44px;
  font: inherit;
  font-weight: 700;
  padding: 9px 6px;
  border-radius: 8px;
  border: 1px solid var(--night-3);
  background: transparent;
  color: var(--text);
  cursor: pointer;
}
.seg button[aria-checked="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.names { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.name-row { display: flex; align-items: center; gap: 10px; }
.name-row input {
  flex: 1;
  min-width: 0;
  font: inherit;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--night-3);
  background: var(--night);
  color: var(--text);
}
.chip { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--night), 0 0 0 3px var(--frost); }

/* ---------- верхняя полоса ---------- */
.topbar { display: flex; align-items: center; gap: 10px; }
.topbar .logo { margin-right: auto; }
.timer { font-variant-numeric: tabular-nums; color: var(--frost); font-size: 14px; }

/* ---------- поле ---------- */
.board-wrap { width: 100%; }
.board {
  --u: calc(100% / 12.2);
  display: grid;
  grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr;
  grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr;
  aspect-ratio: 1;
  width: 100%;
  gap: 1px;
  background: #8fa3b8;
  border: 2px solid #8fa3b8;
  border-radius: 6px;
  overflow: hidden;
  container-type: inline-size;
}
.cell {
  position: relative;
  background: var(--snow);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--f-narrow);
  font-size: clamp(6px, 2.05cqi, 11px);
  line-height: 1.05;
  overflow: hidden;
  cursor: pointer;
  padding: 1px;
  min-width: 0;
}
.cell .nm { overflow-wrap: normal; hyphens: manual; max-width: 100%; }
.cell.side-t, .cell.side-b { font-size: clamp(6px, 1.85cqi, 10px); }
.cell.side-t.deck .nm, .cell.side-b.deck .nm { display: none; }
.cell.side-t.deck .ic, .cell.side-b.deck .ic { font-size: 2.2em; }
.cell .pr { opacity: .65; font-size: .9em; margin-top: 1px; }
.cell .ic { font-size: 1.6em; line-height: 1; }
.cell.corner { background: var(--snow-2); font-weight: 700; }
.cell.corner .ic { font-size: 2.3em; }

/* цветная полоса группы — на внутренней стороне */
.cell .bar { position: absolute; background: var(--gc); display: flex; gap: 1px; align-items: center; justify-content: center; }
.cell.side-b .bar { top: 0; left: 0; right: 0; height: 22%; }
.cell.side-t .bar { bottom: 0; left: 0; right: 0; height: 22%; }
.cell.side-l .bar { top: 0; bottom: 0; right: 0; width: 18%; flex-direction: column; }
.cell.side-r .bar { top: 0; bottom: 0; left: 0; width: 18%; flex-direction: column; }
.cell.side-b { padding-top: 24%; }
.cell.side-t { padding-bottom: 24%; }
.cell.side-l { padding-right: 20%; }
.cell.side-r { padding-left: 20%; }
/* дома и отель на полосе */
.house { width: 4px; height: 4px; background: #fff; border-radius: 1px; box-shadow: 0 0 0 .5px #000a; }
.hotel { width: 9px; height: 5px; background: var(--danger); border-radius: 1px; box-shadow: 0 0 0 .5px #000c; }
.side-l .hotel, .side-r .hotel { width: 5px; height: 9px; }

/* владелец — рамка цвета игрока */
.cell.owned { box-shadow: inset 0 0 0 2px var(--oc); }

.tokens { position: absolute; inset: auto 1px 1px 1px; display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; pointer-events: none; }
.token {
  width: clamp(7px, 2.6cqi, 14px);
  height: clamp(7px, 2.6cqi, 14px);
  border-radius: 50%;
  background: var(--tc);
  box-shadow: 0 0 0 1px #fff, 0 1px 2px #0008;
}
.token.active { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.3); } }

/* центр поля */
.center {
  grid-area: 2 / 2 / 11 / 11;
  background: var(--night);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5cqi;
  padding: 3cqi;
  text-align: center;
  min-width: 0;
}
.center .logo { font-size: 11cqi; }
.center .who { font-size: 4.2cqi; font-weight: 700; display: flex; align-items: center; gap: 1.5cqi; }
.center .who .chip { width: 3.5cqi; height: 3.5cqi; }
.center .msg { font-size: 3.4cqi; color: var(--frost); max-width: 92%; min-height: 2.4em; }
.dice { display: flex; gap: 3cqi; }
.die {
  width: 13cqi; height: 13cqi;
  background: var(--snow);
  border-radius: 2.2cqi;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 1.6cqi;
  box-shadow: 0 1cqi 0 #0006;
}
.die i { width: 2.6cqi; height: 2.6cqi; border-radius: 50%; background: var(--ink); place-self: center; }
.die.empty { opacity: .25; }
.dice.roll .die { animation: shake .45s ease-out; }
@keyframes shake {
  0% { transform: rotate(0) translateY(0); }
  30% { transform: rotate(-20deg) translateY(-3cqi); }
  60% { transform: rotate(14deg) translateY(0); }
  100% { transform: rotate(0); }
}

/* ---------- действия ---------- */
.actions { display: flex; flex-direction: column; gap: 8px; }
.turn-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 17px; font-weight: 700;
}
.turn-head .money { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
.act-row { display: flex; gap: 8px; flex-wrap: wrap; }
.act-row .btn { flex: 1 1 140px; }
.notice { background: var(--night-2); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; }
.notice.bad { border-left-color: var(--danger); }

/* ---------- игроки ---------- */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.pl {
  background: var(--night-2);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex; align-items: center; gap: 8px;
  min-width: 0;
}
.pl.cur { box-shadow: inset 0 0 0 2px var(--gold); }
.pl.out { opacity: .4; }
.pl .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pl .mn { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--gold); white-space: nowrap; }
.pl .tags { font-size: 12px; color: var(--frost); }
.pl .col { display: flex; flex-direction: column; min-width: 0; }

/* ---------- имущество ---------- */
.assets { display: flex; flex-direction: column; gap: 6px; }
.asset { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.asset .sw { width: 6px; align-self: stretch; border-radius: 3px; background: var(--gc); }
.asset .info { flex: 1; min-width: 0; }
.asset .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset .info span { font-size: 12px; color: var(--frost); }
.empty-note { color: var(--frost); margin: 0; }

/* ---------- журнал ---------- */
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--frost); max-height: 220px; overflow-y: auto; }
.log li:first-child { color: var(--text); }

/* ---------- шторка ---------- */
.sheet-bg { position: fixed; inset: 0; background: #000a; z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-height: 85%;
  overflow-y: auto;
  background: var(--night-2);
  border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 -8px 30px #0008;
}
.sheet h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.15; text-wrap: balance; }
.sheet .sub { color: var(--frost); margin: -6px 0 0; }
.sheet .band { height: 10px; border-radius: 4px; background: var(--gc); }
.rent { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rent td { padding: 5px 0; border-bottom: 1px solid var(--night-3); }
.rent td:last-child { text-align: right; }
.rent tr.on td { color: var(--gold); font-weight: 700; }

/* карточка Байанай / Тюсюлгэ */
.card-face {
  background: var(--snow); color: var(--ink);
  border-radius: 12px; padding: 20px 18px;
  text-align: center;
  border: 3px double var(--gc);
}
.card-face .deck { font-family: var(--f-display); font-size: 22px; color: var(--gc); margin-bottom: 8px; }
.card-face p { margin: 0; font-size: 17px; }

.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--danger); color: #fff;
  padding: 10px 16px; border-radius: 8px; z-index: 30;
  max-width: 90%;
}

.winner { text-align: center; }
.winner .logo { font-size: 40px; }

@media (prefers-reduced-motion: reduce) {
  .token.active, .dice.roll .die { animation: none; }
}

</style>
</head>
<body>

<div id="app" lang="ru">
  <!-- Экран настройки -->
  <section id="setup" class="screen">
    <header class="setup-head">
      <h1 class="logo">Баай</h1>
      <p class="tagline">Экономическая игра про Якутию</p>
    </header>

    <div id="resume-box" class="panel" hidden>
      <p>Есть незаконченная партия.</p>
      <button id="btn-resume" class="btn primary" type="button">Продолжить партию</button>
    </div>

    <div class="panel">
      <h2 class="h2">Игроки</h2>
      <div class="seg" id="count-seg" role="radiogroup" aria-label="Число игроков"></div>
      <div id="names" class="names"></div>
    </div>

    <div class="panel">
      <h2 class="h2">Ограничение по времени</h2>
      <div class="seg" id="time-seg" role="radiogroup" aria-label="Время партии"></div>
      <p class="hint">Когда время выйдет, побеждает самый богатый: деньги плюс имущество.</p>
    </div>

    <button id="btn-start" class="btn primary big" type="button">Начать игру</button>
    <p class="copy">© 2026 Евсеев А.В.</p>
  </section>

  <!-- Экран игры -->
  <section id="game" class="screen" hidden>
    <div class="topbar">
      <span class="logo small">Баай</span>
      <span id="timer" class="timer"></span>
      <button id="btn-menu" class="btn ghost" type="button" aria-label="Меню">Меню</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Игровое поле"></div>
    </div>

    <div id="actions" class="actions"></div>
    <div id="players" class="players"></div>

    <div class="panel">
      <h2 class="h2" id="assets-title">Имущество</h2>
      <div id="assets" class="assets"></div>
    </div>

    <div class="panel">
      <h2 class="h2">События</h2>
      <ol id="log" class="log"></ol>
    </div>
    <p class="copy">© 2026 Евсеев А.В.</p>
  </section>

  <!-- Нижняя шторка: клетка, карточка, меню, итог -->
  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script>
/* «Баай» — данные игры: поле, цены, аренда, карточки.
   Здесь только данные. Правила — в engine.js, экран — в ui.js.
   © 2026 Евсеев А.В. */
(function (root) {
  'use strict';

  // Группы участков: цвет на поле, цена дома
  const GROUPS = {
    1: { name: 'Река Лена',          color: '#8a5a3c', house: 50 },
    2: { name: 'Вилюй',              color: '#4fb3d9', house: 50 },
    3: { name: 'Центральные улусы',  color: '#c2559b', house: 100 },
    4: { name: 'Юг',                 color: '#e8892b', house: 100 },

  // Участок: rent = [пустой, 1 дом, 2, 3, 4, отель]

    T('Паромная переправа', 'Паром', '⛴'),
    P('Алдан', 'Алдан', 4, 180,       [14, 70, 195, 490, 630, 770]),
    { type: 'tyusyulge', name: 'Тюсюлгэ', short: 'Тюсюлгэ', icon: '🏕' },
    P('Томмот', 'Томмот', 4, 180,     [14, 70, 195, 490, 630, 770]),

    P('Тикси', 'Тикси', 6, 260,       [21, 105, 295, 735, 945, 1155]),

    U('Газопровод', 'Газ', '🔥'),
    P('Среднеколымск', 'Ср.-Ко\u00ADлымск', 6, 280, [22, 110, 310, 770, 990, 1210]),

    { type: 'gotojail', name: 'Застрял на зимнике → в изолятор', short: 'Зимник', icon: '❄' },
    P('Удачный', 'Удачный', 7, 300,   [24, 120, 335, 840, 1080, 1320]),
    P('Айхал', 'Айхал', 7, 300,       [24, 120, 335, 840, 1080, 1320]),
    { type: 'tyusyulge', name: 'Тюсюлгэ', short: 'Тюсюлгэ', icon: '🏕' },
    P('Мирный', 'Мирный', 7, 320,     [26, 130, 365, 910, 1170, 1430]),
    T('Аэропорт «Якутск»', 'Аэропорт', '✈'),
    { type: 'bayanai', name: 'Байанай', short: 'Байанай', icon: '🏹' },

  const RULES = {

    passStart: 200,
    jailFine: 50,
    jailPos: 10,
    maxJailTries: 3,
    transportRent: [0, 25, 50, 100, 200],

<script>
/* «Баай» — движок правил.
   Состояние партии — обычный JSON-объект. Меняется только через act(state, action).
   Экран (ui.js) ничего не считает сам: он рисует state и отправляет действия.
   На этапе 3 этот же файл будет работать у хоста, а гости будут слать ему действия.
   © 2026 Евсеев А.В. */
(function (root) {
  'use strict';

  const D = (typeof module !== 'undefined') ? require('./data.js') : root.BAAI.data;
  const { BOARD, GROUPS, BAYANAI, TYUSYULGE, RULES } = D;
  const DECKS = { bayanai: BAYANAI, tyusyulge: TYUSYULGE };
  const DECK_NAMES = { bayanai: 'Байанай', tyusyulge: 'Тюсюлгэ' };
  const BANK = -1;

  let rand = Math.random;
  const die = () => 1 + Math.floor(rand() * 6);
  const rub = n => n.toLocaleString('ru-RU').replace(/ /g, ' ') + ' ₽';

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------- создание партии ----------
  function create(players, options = {}) {
    const minutes = Number(options.minutes) || 0;
    return {
      v: 1,
      players: players.map(p => ({
        name: p.name, color: p.color,
        money: RULES.startMoney, pos: 0,
        inJail: false, jailTries: 0, freeCards: [], bankrupt: false,
      })),
      own: {},                 // номер клетки → { owner, houses } (5 домов = отель)
      turn: 0,
      phase: 'roll',           // roll | buy | end | debt | over
      dice: null,
      doubles: 0,
      extra: false,            // выпал дубль — после хода бросаешь ещё
      pending: null,           // { kind:'buy', cell } | { kind:'debt', amount, to, reason, after }
      decks: {
        bayanai: shuffle(BAYANAI.map((_, i) => i)),
        tyusyulge: shuffle(TYUSYULGE.map((_, i) => i)),
      },
      card: null,              // последняя вытянутая карточка
      log: [],
      seq: 0,                  // счётчик изменений — экран по нему понимает, что перерисовать
      endsAt: minutes ? Date.now() + minutes * 60000 : 0,
      winner: null,
      overReason: '',
    };
  }

  // ---------- вспомогательное ----------
  const cur = s => s.players[s.turn];
  const nameOf = (s, i) => i === BANK ? 'банк' : (i === 'each' ? 'игрокам' : s.players[i].name);

  function log(s, text) {
    s.log.push(text);
    if (s.log.length > 100) s.log.splice(0, s.log.length - 100);
  }

  function groupCells(g) {
    const out = [];
    BOARD.forEach((c, i) => { if (c.type === 'prop' && c.group === g) out.push(i); });
    return out;
  }

  function ownsGroup(s, p, g) {
    return groupCells(g).every(i => s.own[i] && s.own[i].owner === p);
  }

  function countOwned(s, p, type) {
    return BOARD.reduce((n, c, i) => n + (c.type === type && s.own[i] && s.own[i].owner === p ? 1 : 0), 0);
  }

  function rentFor(s, i, opts = {}) {
    const c = BOARD[i], o = s.own[i];
    if (!o) return 0;
    if (c.type === 'prop') {
      if (o.houses > 0) return c.rent[o.houses];
      return c.rent[0] * (ownsGroup(s, o.owner, c.group) ? 2 : 1);
    }
    if (c.type === 'transport') {
      return RULES.transportRent[countOwned(s, o.owner, 'transport')] * (opts.mult || 1);
    }
    if (c.type === 'utility') {
      const sum = opts.diceSum || (s.dice ? s.dice[0] + s.dice[1] : 7);
      const mult = opts.force10 ? 10 : RULES.utilityMult[countOwned(s, o.owner, 'utility')];
      return sum * mult;
    }
    return 0;
  }

  function netWorth(s, p) {
    let w = s.players[p].money;
    for (const k in s.own) {
      const o = s.own[k];
      if (o.owner !== p) continue;
      const c = BOARD[k];
      w += c.price;
      if (c.type === 'prop') w += o.houses * GROUPS[c.group].house;
    }
    return w;
  }

  // ---------- строительство ----------
  function canBuild(s, p, i) {
    const c = BOARD[i], o = s.own[i];
    if (!c || c.type !== 'prop' || !o || o.owner !== p) return false;
    if (!ownsGroup(s, p, c.group) || o.houses >= 5) return false;
    const min = Math.min(...groupCells(c.group).map(j => s.own[j].houses));
    return o.houses === min && s.players[p].money >= GROUPS[c.group].house;
  }

  function canSell(s, p, i) {
    const c = BOARD[i], o = s.own[i];
    if (!c || c.type !== 'prop' || !o || o.owner !== p || o.houses === 0) return false;
    const max = Math.max(...groupCells(c.group).map(j => s.own[j].houses));
    return o.houses === max;
  }

  function sellValue(i) { return Math.floor(GROUPS[BOARD[i].group].house * RULES.sellRate); }

  function doSell(s, p, i) {
    s.own[i].houses--;
    s.players[p].money += sellValue(i);
  }

  // Сколько игрок может собрать, продав все дома
  function liquidValue(s, p) {
    let v = s.players[p].money;
    for (const k in s.own) if (s.own[k].owner === p && BOARD[k].type === 'prop') v += s.own[k].houses * sellValue(k);
    return v;
  }

  // Продать дома автоматически (для игроков, которые платят не в свой ход)
  function autoSell(s, p, need) {
    let sold = 0;
    while (s.players[p].money < need) {
      let best = -1;
      for (const k in s.own) {
        const i = Number(k);
        if (canSell(s, p, i) && (best < 0 || BOARD[i].price > BOARD[best].price)) best = i;
      }
      if (best < 0) break;
      doSell(s, p, best); sold++;
    }
    if (sold) log(s, `${s.players[p].name} продаёт домов: ${sold}`);
  }

  // ---------- деньги ----------
  // Заплатить: to — номер игрока, BANK или 'each' (поровну всем остальным)
  function charge(s, p, to, amount, reason, after) {
    const pl = s.players[p];
    if (amount <= 0) { if (after) runAfter(s, after); return; }
    if (pl.money < amount && p !== s.turn) autoSell(s, p, amount);
    if (pl.money >= amount) {
      pay(s, p, to, amount);
      log(s, `${pl.name} платит ${rub(amount)} (${reason})`);
      if (after) runAfter(s, after);
      return;
    }
    if (p === s.turn) {
      // Свой ход — даём самому продать дома или объявить банкротство
      s.pending = { kind: 'debt', amount, to, reason, after: after || null };
      s.phase = 'debt';
      log(s, `${pl.name} не хватает денег: нужно ${rub(amount)} (${reason})`);
    } else {
      bankrupt(s, p, to === 'each' ? BANK : to);
    }
  }

  function pay(s, p, to, amount) {
    s.players[p].money -= amount;
    if (to === 'each') {
      const others = alive(s).filter(i => i !== p);
      const part = Math.floor(amount / Math.max(1, others.length));
      others.forEach(i => { s.players[i].money += part; });
    } else if (to !== BANK) {
      s.players[to].money += amount;
    }
  }

  const alive = s => s.players.map((_, i) => i).filter(i => !s.players[i].bankrupt);

  function bankrupt(s, p, to) {
    const pl = s.players[p];
    for (const k in s.own) {
      const o = s.own[k];
      if (o.owner !== p) continue;
      if (BOARD[k].type === 'prop' && o.houses) { pl.money += o.houses * sellValue(k); o.houses = 0; }
      if (to === BANK) delete s.own[k]; else o.owner = to;
    }
    if (to === BANK) {
      pl.freeCards.forEach(d => s.decks[d].push(DECKS[d].findIndex(c => c.free)));
    } else {
      s.players[to].money += Math.max(0, pl.money);
      s.players[to].freeCards.push(...pl.freeCards);
    }
    pl.freeCards = []; pl.money = 0; pl.bankrupt = true; pl.inJail = false;
    log(s, `💥 ${pl.name} — банкрот. Имущество получает ${nameOf(s, to)}.`);

    const left = alive(s);
    if (left.length <= 1) {
      s.phase = 'over'; s.pending = null;
      s.winner = left[0] ?? null;
      s.overReason = 'last';
      log(s, `🏆 Победитель: ${s.players[s.winner].name}`);
      return;
    }
    if (p === s.turn) { s.pending = null; s.extra = false; s.phase = 'end'; }
  }

  // ---------- движение ----------
  function passStart(s, p) {
    s.players[p].money += RULES.passStart;
    log(s, `${s.players[p].name} проходит Старт: +${rub(RULES.passStart)}`);
  }

  function moveBy(s, p, steps) {
    const pl = s.players[p];
    const to = (pl.pos + steps) % 40;
    if (pl.pos + steps >= 40) passStart(s, p);
    pl.pos = to;
    log(s, `${pl.name} → ${BOARD[to].name}`);
    land(s, p);
  }

  function moveTo(s, p, to, opts) {
    const pl = s.players[p];
    if (to < pl.pos || to === 0) passStart(s, p);
    pl.pos = to;
    log(s, `${pl.name} → ${BOARD[to].name}`);
    land(s, p, opts);
  }

  function sendToJail(s, p) {
    const pl = s.players[p];
    pl.pos = RULES.jailPos; pl.inJail = true; pl.jailTries = 0;
    if (p === s.turn) { s.extra = false; s.doubles = 0; }
    log(s, `🔒 ${pl.name} отправляется в изолятор`);
  }

  // Что происходит на клетке
  function land(s, p, opts = {}) {
    const pl = s.players[p];
    const i = pl.pos, c = BOARD[i];
    switch (c.type) {
      case 'prop': case 'transport': case 'utility': {
        const o = s.own[i];
        if (!o) { s.pending = { kind: 'buy', cell: i }; s.phase = 'buy'; return; }
        if (o.owner === p) return;
        const rent = rentFor(s, i, opts);
        charge(s, p, o.owner, rent, `аренда: ${c.name} → ${s.players[o.owner].name}`);
        return;
      }
      case 'tax':
        charge(s, p, BANK, c.amount, c.name);
        return;
      case 'bayanai': case 'tyusyulge':
        drawCard(s, p, c.type);
        return;
      case 'gotojail':
        sendToJail(s, p);
        return;
      default:
        return;
    }
  }

  function drawCard(s, p, deck) {
    const id = s.decks[deck].shift();
    const card = DECKS[deck][id];
    if (!card.free) s.decks[deck].push(id);
    s.card = { deck, title: DECK_NAMES[deck], text: card.text, seq: s.seq + 1, player: p };
    log(s, `${DECK_NAMES[deck]}: ${card.text}`);
    const pl = s.players[p];

    if (card.money > 0) { pl.money += card.money; return; }
    if (card.money < 0) { charge(s, p, BANK, -card.money, DECK_NAMES[deck]); return; }
    if (card.free) { pl.freeCards.push(deck); return; }
    if (card.jail) { sendToJail(s, p); return; }
    if (card.moveTo !== undefined) { moveTo(s, p, card.moveTo); return; }
    if (card.back) {
      pl.pos = (pl.pos - card.back + 40) % 40;
      log(s, `${pl.name} → ${BOARD[pl.pos].name}`);
      land(s, p);
      return;
    }
    if (card.each > 0) {
      alive(s).filter(i => i !== p).forEach(i => {
        if (!s.players[i].bankrupt && s.phase !== 'over') charge(s, i, p, card.each, DECK_NAMES[deck]);
      });
      return;
    }
    if (card.each < 0) {
      const n = alive(s).length - 1;
      charge(s, p, 'each', -card.each * n, DECK_NAMES[deck]);
      return;
    }
    if (card.repairs) {
      let h = 0, hot = 0;
      for (const k in s.own) {
        const o = s.own[k];
        if (o.owner !== p || BOARD[k].type !== 'prop') continue;
        if (o.houses === 5) hot++; else h += o.houses;
      }
      charge(s, p, BANK, h * card.repairs[0] + hot * card.repairs[1], DECK_NAMES[deck]);
      return;
    }
    if (card.nearest) {
      let i = pl.pos;
      do { i = (i + 1) % 40; } while (BOARD[i].type !== card.nearest);
      if (card.nearest === 'transport') moveTo(s, p, i, { mult: 2 });
      else {
        const o = s.own[i];
        let opts = {};
        if (o && o.owner !== p) {
          const d = [die(), die()];
          log(s, `Бросок для оплаты: ${d[0]} + ${d[1]}`);
          opts = { diceSum: d[0] + d[1], force10: true };
        }
        moveTo(s, p, i, opts);
      }
    }
  }

  // Продолжение после оплаты долга
  function runAfter(s, after) {
    if (after && after.move) moveBy(s, s.turn, after.move);
  }

  // Ход закончен или можно бросать ещё раз
  function settle(s) {
    if (s.phase === 'buy' || s.phase === 'debt' || s.phase === 'over') return;
    const pl = cur(s);
    s.phase = (s.extra && !pl.inJail && !pl.bankrupt) ? 'roll' : 'end';
  }

  function nextTurn(s) {
    if (s.endsAt && Date.now() >= s.endsAt) return finishByTime(s);
    let t = s.turn;
    do { t = (t + 1) % s.players.length; } while (s.players[t].bankrupt);
    s.turn = t; s.phase = 'roll'; s.doubles = 0; s.extra = false; s.dice = null; s.pending = null;
    log(s, `— Ход: ${s.players[t].name}`);
  }

  function finishByTime(s) {
    let best = null, bw = -1;
    alive(s).forEach(i => { const w = netWorth(s, i); if (w > bw) { bw = w; best = i; } });
    s.phase = 'over'; s.winner = best; s.overReason = 'time'; s.pending = null;
    log(s, `⏰ Время вышло. Самый богатый: ${s.players[best].name} (${rub(bw)})`);
  }

  // ---------- действия ----------
  // action = { type, player, cell? }. Возвращает { ok } или { ok:false, error }.
  function act(s, a) {
    const r = actInner(s, a);
    if (r.ok) s.seq++;
    return r;
  }

  function actInner(s, a) {
    if (s.phase === 'over') return err('Партия окончена');
    const p = a.player;
    if (p !== s.turn) return err('Сейчас не ваш ход');
    const pl = cur(s);

    switch (a.type) {
      case 'roll': {
        if (s.phase !== 'roll') return err('Сейчас нельзя бросать');
        const d = [die(), die()];
        s.dice = d; s.card = null;
        const dbl = d[0] === d[1], sum = d[0] + d[1];
        log(s, `🎲 ${pl.name}: ${d[0]} + ${d[1]}${dbl ? ' — дубль!' : ''}`);

        if (pl.inJail) {
          if (dbl) {
            pl.inJail = false; pl.jailTries = 0; s.extra = false;
            log(s, `${pl.name} выходит из изолятора`);
            moveBy(s, p, sum);
          } else {
            pl.jailTries++;
            if (pl.jailTries >= RULES.maxJailTries) {
              pl.inJail = false; pl.jailTries = 0; s.extra = false;
              charge(s, p, BANK, RULES.jailFine, 'выход из изолятора', { move: sum });
            } else {
              log(s, `${pl.name} остаётся в изоляторе (попытка ${pl.jailTries} из ${RULES.maxJailTries})`);
            }
          }
          s.extra = false;
          settle(s);
          return ok();
        }

        if (dbl) {
          s.doubles++;
          if (s.doubles >= 3) {
            log(s, 'Три дубля подряд!');
            sendToJail(s, p);
            settle(s);
            return ok();
          }
          s.extra = true;
        } else s.extra = false;
        moveBy(s, p, sum);
        settle(s);
        return ok();
      }

      case 'payJail': {
        if (s.phase !== 'roll' || !pl.inJail) return err('Вы не в изоляторе');
        if (pl.money < RULES.jailFine) return err('Не хватает денег');
        pl.money -= RULES.jailFine; pl.inJail = false; pl.jailTries = 0;
        log(s, `${pl.name} платит ${rub(RULES.jailFine)} и выходит из изолятора`);
        return ok();
      }

      case 'useCard': {
        if (s.phase !== 'roll' || !pl.inJail) return err('Вы не в изоляторе');
        if (!pl.freeCards.length) return err('Нет карты освобождения');
        const deck = pl.freeCards.shift();
        s.decks[deck].push(DECKS[deck].findIndex(c => c.free));
        pl.inJail = false; pl.jailTries = 0;
        log(s, `${pl.name} использует карту освобождения`);
        return ok();
      }

      case 'buy': {
        if (s.phase !== 'buy') return err('Нечего покупать');
        const i = s.pending.cell, c = BOARD[i];
        if (pl.money < c.price) return err('Не хватает денег');
        pl.money -= c.price;
        s.own[i] = { owner: p, houses: 0 };
        s.pending = null; s.phase = 'moving';
        log(s, `🏠 ${pl.name} покупает ${c.name} за ${rub(c.price)}`);
        settle(s);
        return ok();
      }

      case 'decline': {
        if (s.phase !== 'buy') return err('Нечего покупать');
        log(s, `${pl.name} не покупает ${BOARD[s.pending.cell].name}`);
        s.pending = null; s.phase = 'moving';
        settle(s);
        return ok();
      }

      case 'build': {
        if (s.phase !== 'roll' && s.phase !== 'end') return err('Сейчас строить нельзя');
        if (!canBuild(s, p, a.cell)) return err('Здесь строить нельзя');
        const c = BOARD[a.cell], cost = GROUPS[c.group].house;
        pl.money -= cost;
        s.own[a.cell].houses++;
        const h = s.own[a.cell].houses;
        log(s, `${pl.name} строит ${h === 5 ? 'отель' : 'дом'}: ${c.name} (−${rub(cost)})`);
        return ok();
      }

      case 'sell': {
        if (!['roll', 'end', 'debt'].includes(s.phase)) return err('Сейчас продавать нельзя');
        if (!canSell(s, p, a.cell)) return err('Здесь продавать нельзя');
        const was = s.own[a.cell].houses;
        doSell(s, p, a.cell);
        log(s, `${pl.name} продаёт ${was === 5 ? 'отель' : 'дом'}: ${BOARD[a.cell].name} (+${rub(sellValue(a.cell))})`);
        return ok();
      }

      case 'payDebt': {
        if (s.phase !== 'debt') return err('Долга нет');
        const d = s.pending;
        if (pl.money < d.amount) return err('Всё ещё не хватает денег');
        s.pending = null; s.phase = 'moving';
        pay(s, p, d.to, d.amount);
        log(s, `${pl.name} платит ${rub(d.amount)} (${d.reason})`);
        if (d.after) runAfter(s, d.after);
        settle(s);
        return ok();
      }

      case 'bankrupt': {
        if (s.phase !== 'debt') return err('Банкротство объявляют, только если не хватает на долг');
        const to = s.pending.to === 'each' ? BANK : s.pending.to;
        bankrupt(s, p, to);
        return ok();
      }

      case 'endTurn': {
        if (s.phase !== 'end') return err('Ход ещё не закончен');
        nextTurn(s);
        return ok();
      }
    }
    return err('Неизвестное действие');
  }

  const ok = () => ({ ok: true });
  const err = e => ({ ok: false, error: e });

  const Engine = {
    create, act, rentFor, netWorth, canBuild, canSell, ownsGroup, groupCells,
    liquidValue, sellValue, rub, BANK,
    setRandom(fn) { rand = fn; },
  };
  root.BAAI = root.BAAI || {};
  root.BAAI.engine = Engine;
  if (typeof module !== 'undefined') module.exports = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* «Баай» — экран игры на одном телефоне.
   Рисует состояние из движка и отправляет ему действия. Правил здесь нет.
   © 2026 Евсеев А.В. */
(function () {
  'use strict';

  const { BOARD, GROUPS, RULES, COLORS } = BAAI.data;
  const E = BAAI.engine;
  const rub = E.rub;
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const SAVE_KEY = 'baai.save.v1';
  const NAMES_KEY = 'baai.names.v1';
  const DECK_COLOR = { bayanai: '#2f7d5b', tyusyulge: '#b4562a' };
  const DECK_ABOUT = {
    bayanai: 'Колода «Байанай» — дух охоты и удачи. Перемещения, находки и неприятности в дороге.',
    tyusyulge: 'Колода «Тюсюлгэ» — место праздника Ысыах. Деньги, выплаты и события в улусе.',
  };

  let G = null;               // текущая партия
  let shownCard = 0;          // seq последней показанной карточки
  let setup = { count: 3, minutes: 0, names: [] };

  // ---------- сохранение ----------
  function save() {
    try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); else localStorage.removeItem(SAVE_KEY); } catch (e) { /* без сохранения */ }
  }
  function loadSaved() {
    try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function loadNames() {
    try { return JSON.parse(localStorage.getItem(NAMES_KEY)) || []; } catch (e) { return []; }
  }
  function saveNames() {
    try { localStorage.setItem(NAMES_KEY, JSON.stringify(setup.names)); } catch (e) { /* ничего */ }
  }

  // ---------- экран настройки ----------
  function renderSetup() {
    $('count-seg').innerHTML = [2, 3, 4, 5, 6].map(n =>
      `<button type="button" role="radio" aria-checked="${n === setup.count}" data-n="${n}">${n}</button>`).join('');
    $('time-seg').innerHTML = [[0, 'Без лимита'], [30, '30 мин'], [60, '60 мин'], [90, '90 мин']].map(([m, t]) =>
      `<button type="button" role="radio" aria-checked="${m === setup.minutes}" data-m="${m}">${t}</button>`).join('');
    let html = '';
    for (let i = 0; i < setup.count; i++) {
      const v = setup.names[i] || `Игрок ${i + 1}`;
      html += `<label class="name-row"><span class="chip" style="background:${COLORS[i]}"></span>
        <input id="name-${i}" type="text" maxlength="14" value="${esc(v)}" aria-label="Имя игрока ${i + 1}"></label>`;
    }
    $('names').innerHTML = html;
    $('resume-box').hidden = !loadSaved();
  }

  function readNames() {
    for (let i = 0; i < setup.count; i++) {
      const el = $('name-' + i);
      if (el) setup.names[i] = el.value.trim() || `Игрок ${i + 1}`;
    }
  }

  function startGame() {
    readNames(); saveNames();
    const players = [];
    for (let i = 0; i < setup.count; i++) players.push({ name: setup.names[i] || `Игрок ${i + 1}`, color: COLORS[i] });
    G = E.create(players, { minutes: setup.minutes });
    G.log.push(`— Ход: ${G.players[0].name}`);
    shownCard = 0;
    save();
    showGame();
  }

  function showGame() {
    $('setup').hidden = true;
    $('game').hidden = false;
    closeSheet();
    render();
  }

  function showSetup() {
    $('game').hidden = true;
    $('setup').hidden = false;
    closeSheet();
    renderSetup();
  }

  // ---------- поле ----------
  function gridPos(i) {
    if (i <= 10) return [11, 11 - i];
    if (i < 20) return [21 - i, 1];
    if (i <= 30) return [1, i - 19];
    return [i - 29, 11];
  }
  function side(i) {
    if (i % 10 === 0) return 'corner';
    if (i < 10) return 'side-b';
    if (i < 20) return 'side-l';
    if (i < 30) return 'side-t';
    return 'side-r';
  }

  function cellHTML(i) {
    const c = BOARD[i], o = G.own[i];
    const sd = side(i);
    const cls = ['cell', sd === 'corner' ? 'corner' : sd];
    if (c.type === 'bayanai' || c.type === 'tyusyulge') cls.push('deck');
    let style = '';
    let inner = '';
    if (o) { cls.push('owned'); style += `--oc:${G.players[o.owner].color};`; }

    if (c.type === 'prop') {
      style += `--gc:${GROUPS[c.group].color};`;
      let marks = '';
      if (o && o.houses === 5) marks = '<span class="hotel"></span>';
      else if (o) marks = '<span class="house"></span>'.repeat(o.houses);
      inner = `<span class="bar">${marks}</span><span class="nm">${esc(c.short)}</span>`;
      if (!o) inner += `<span class="pr">${c.price}</span>`;
    } else if (c.type === 'transport' || c.type === 'utility') {
      inner = `<span class="ic" aria-hidden="true">${c.icon}</span><span class="nm">${esc(c.short)}</span>`;
      if (!o) inner += `<span class="pr">${c.price}</span>`;
    } else {
      inner = `<span class="ic" aria-hidden="true">${c.icon}</span><span class="nm">${esc(c.short)}</span>`;
    }

    const toks = G.players.map((p, k) => (!p.bankrupt && p.pos === i)
      ? `<span class="token${k === G.turn ? ' active' : ''}" style="--tc:${p.color}" title="${esc(p.name)}"></span>` : '').join('');
    if (toks) inner += `<span class="tokens">${toks}</span>`;

    const [r, col] = gridPos(i);
    return `<div class="${cls.join(' ')}" style="grid-area:${r}/${col};${style}" data-cell="${i}" role="button" tabindex="0" aria-label="${esc(c.name)}">${inner}</div>`;
  }

  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function dieHTML(n) {
    if (!n) return '<div class="die empty"></div>';
    let h = '';
    for (let k = 0; k < 9; k++) h += PIPS[n].includes(k) ? '<i></i>' : '<span></span>';
    return `<div class="die" aria-label="${n}">${h}</div>`;
  }

  function centerMsg() {
    const pl = G.players[G.turn];
    if (G.phase === 'over') return 'Партия окончена';
    if (G.phase === 'buy') return `${BOARD[G.pending.cell].name}: можно купить`;
    if (G.phase === 'debt') return `Нужно заплатить ${rub(G.pending.amount)}`;
    if (G.phase === 'roll' && pl.inJail) return 'В изоляторе';
    if (G.phase === 'roll' && G.extra) return 'Дубль! Бросай ещё раз';
    if (G.phase === 'roll') return 'Бросай кубики';
    const last = G.log[G.log.length - 1] || '';
    return last;
  }

  let lastDiceSeq = -1;
  function renderBoard() {
    let html = '';
    for (let i = 0; i < 40; i++) html += cellHTML(i);
    const pl = G.players[G.turn];
    const d = G.dice || [0, 0];
    html += `<div class="center">
      <div class="logo">Баай</div>
      <div class="dice${G.dice && G.seq !== lastDiceSeq && G.lastRollSeq === G.seq ? ' roll' : ''}">${dieHTML(d[0])}${dieHTML(d[1])}</div>
      <div class="who"><span class="chip" style="background:${pl.color}"></span>${esc(pl.name)}</div>
      <div class="msg">${esc(centerMsg())}</div>
    </div>`;
    $('board').innerHTML = html;
    lastDiceSeq = G.seq;
  }

  // ---------- панель действий ----------
  function btn(label, action, cls = '', disabled = false, extra = '') {
    return `<button type="button" class="btn ${cls}" data-act="${action}" ${extra} ${disabled ? 'disabled' : ''}>${label}</button>`;
  }

  function renderActions() {
    const pl = G.players[G.turn];
    let h = `<div class="turn-head"><span class="chip" style="background:${pl.color}"></span>${esc(pl.name)}<span class="money">${rub(pl.money)}</span></div>`;

    if (G.phase === 'over') {
      const w = G.players[G.winner];
      h += `<div class="notice">🏆 Победитель: <b>${esc(w.name)}</b>${G.overReason === 'time' ? ` — самый богатый (${rub(E.netWorth(G, G.winner))})` : ''}</div>`;
      h += `<div class="act-row">${btn('Новая партия', 'newGame', 'primary')}</div>`;
    } else if (G.phase === 'roll' && pl.inJail) {
      h += `<div class="notice">Вы в изоляторе. Попытка ${pl.jailTries + 1} из ${RULES.maxJailTries}: выбросьте дубль, заплатите ${RULES.jailFine} ₽ или отдайте карту.</div>`;
      h += `<div class="act-row">${btn('Бросить на дубль', 'roll', 'primary')}${btn(`Заплатить ${RULES.jailFine} ₽`, 'payJail', '', pl.money < RULES.jailFine)}${pl.freeCards.length ? btn('Карта освобождения', 'useCard') : ''}</div>`;
    } else if (G.phase === 'roll') {
      h += `<div class="act-row">${btn(G.extra ? 'Бросить ещё раз' : 'Бросить кубики', 'roll', 'primary big')}</div>`;
    } else if (G.phase === 'buy') {
      const c = BOARD[G.pending.cell];
      const short = pl.money < c.price;
      h += `<div class="notice${short ? ' bad' : ''}"><b>${esc(c.name)}</b> свободен. Цена ${rub(c.price)}.${short ? ' Денег не хватает.' : ''}</div>`;
      h += `<div class="act-row">${btn(`Купить за ${rub(c.price)}`, 'buy', 'primary', short)}${btn('Не покупать', 'decline')}${btn('Подробнее', 'info', 'ghost', false, `data-cell="${G.pending.cell}"`)}</div>`;
    } else if (G.phase === 'debt') {
      const d = G.pending;
      const can = pl.money >= d.amount;
      const liquid = E.liquidValue(G, G.turn);
      h += `<div class="notice bad">Нужно заплатить <b>${rub(d.amount)}</b> (${esc(d.reason)}). У вас ${rub(pl.money)}.
        ${!can && liquid >= d.amount ? ' Продайте дома в разделе «Имущество».' : ''}
        ${liquid < d.amount ? ' Даже с продажей домов не хватает.' : ''}</div>`;
      h += `<div class="act-row">${btn('Заплатить', 'payDebt', 'primary', !can)}${btn('Объявить банкротство', 'bankrupt', 'danger', can)}</div>`;
    } else if (G.phase === 'end') {
      h += `<div class="act-row">${btn('Завершить ход', 'endTurn', 'primary big')}</div>`;
    }
    $('actions').innerHTML = h;
  }

  function renderPlayers() {
    $('players').innerHTML = G.players.map((p, i) => {
      const tags = [];
      if (p.bankrupt) tags.push('банкрот');
      if (p.inJail) tags.push('в изоляторе');
      if (p.freeCards.length) tags.push(`выход из изолятора ×${p.freeCards.length}`);
      return `<div class="pl${i === G.turn ? ' cur' : ''}${p.bankrupt ? ' out' : ''}">
        <span class="chip" style="background:${p.color}"></span>
        <span class="col"><span class="nm">${esc(p.name)}</span>${tags.length ? `<span class="tags">${tags.join(', ')}</span>` : ''}</span>
        <span class="mn">${p.bankrupt ? '—' : rub(p.money)}</span>
      </div>`;
    }).join('');
  }

  function renderAssets() {
    const p = G.turn, pl = G.players[p];
    $('assets-title').textContent = `Имущество: ${pl.name}`;
    const mine = Object.keys(G.own).map(Number).filter(i => G.own[i].owner === p).sort((a, b) => a - b);
    if (!mine.length) { $('assets').innerHTML = '<p class="empty-note">Пока ничего нет.</p>'; return; }
    const canAct = ['roll', 'end', 'debt'].includes(G.phase);
    $('assets').innerHTML = mine.map(i => {
      const c = BOARD[i], o = G.own[i];
      const gc = c.type === 'prop' ? GROUPS[c.group].color : 'var(--frost)';
      let sub = '';
      if (c.type === 'prop') {
        const full = E.ownsGroup(G, p, c.group);
        sub = o.houses === 5 ? 'отель' : o.houses ? `домов: ${o.houses}` : (full ? 'вся группа' : 'участок');
        sub += ` · аренда ${rub(E.rentFor(G, i))}`;
      } else if (c.type === 'transport') sub = `аренда ${rub(E.rentFor(G, i))}`;
      else sub = 'аренда по кубикам';
      let btns = '';
      if (c.type === 'prop' && canAct) {
        const b = E.canBuild(G, p, i) && G.phase !== 'debt';
        const s = E.canSell(G, p, i);
        if (E.ownsGroup(G, p, c.group)) {
          btns = `<button type="button" class="btn sm" data-act="sell" data-cell="${i}" ${s ? '' : 'disabled'} aria-label="Продать дом">−</button>
            <button type="button" class="btn sm" data-act="build" data-cell="${i}" ${b ? '' : 'disabled'} aria-label="Построить: ${GROUPS[c.group].house} ₽">+${GROUPS[c.group].house}</button>`;
        }
      }
      return `<div class="asset" style="--gc:${gc}"><span class="sw"></span>
        <span class="info" data-act="info" data-cell="${i}" role="button" tabindex="0"><b>${esc(c.name)}</b><span>${sub}</span></span>${btns}</div>`;
    }).join('');
  }

  function renderLog() {
    $('log').innerHTML = G.log.slice(-30).reverse().map(t => `<li>${esc(t)}</li>`).join('');
  }

  function renderTimer() {
    const el = $('timer');
    if (!G || !G.endsAt || G.phase === 'over') { el.textContent = ''; return; }
    const left = Math.max(0, G.endsAt - Date.now());
    if (!left) { el.textContent = 'Время вышло: последний ход'; return; }
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    el.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;
  }

  function render() {
    renderBoard();
    renderActions();
    renderPlayers();
    renderAssets();
    renderLog();
    renderTimer();
    if (G.card && G.card.seq > shownCard) {
      shownCard = G.card.seq;
      showCard(G.card);
    }
  }

  // ---------- шторки ----------
  function openSheet(html) {
    $('sheet').innerHTML = html;
    $('sheet').hidden = false;
    $('sheet-bg').hidden = false;
    const f = $('sheet').querySelector('.btn');
    if (f) f.focus({ preventScroll: true });
  }
  function closeSheet() {
    $('sheet').hidden = true;
    $('sheet-bg').hidden = true;
  }

  function showCard(card) {
    openSheet(`<div class="card-face" style="--gc:${DECK_COLOR[card.deck]}">
        <div class="deck">${esc(card.title)}</div><p>${esc(card.text)}</p></div>
      ${btn('Понятно', 'close', 'primary')}`);
  }

  function showCell(i) {
    const c = BOARD[i], o = G.own[i];
    const owner = o ? G.players[o.owner].name : 'свободна';
    let h = '';
    if (c.type === 'prop') {
      const g = GROUPS[c.group];
      const full = o && E.ownsGroup(G, o.owner, c.group);
      const cur = o ? o.houses : -1;
      const rows = [
        ['Участок', c.rent[0], cur === 0 && !full],
        ['Вся группа у владельца', c.rent[0] * 2, cur === 0 && full],
        ['1 дом', c.rent[1], cur === 1], ['2 дома', c.rent[2], cur === 2],
        ['3 дома', c.rent[3], cur === 3], ['4 дома', c.rent[4], cur === 4],
        ['Отель', c.rent[5], cur === 5],
      ];
      h = `<div class="band" style="--gc:${g.color}"></div><h3>${esc(c.name)}</h3><p class="sub">${esc(g.name)}</p>
        <table class="rent"><tbody>
          ${rows.map(r => `<tr class="${r[2] ? 'on' : ''}"><td>${r[0]}</td><td>${rub(r[1])}</td></tr>`).join('')}
          <tr><td>Цена участка</td><td>${rub(c.price)}</td></tr>
          <tr><td>Дом или отель</td><td>${rub(g.house)}</td></tr>
          <tr><td>Владелец</td><td>${esc(owner)}</td></tr>
        </tbody></table>`;
      if (o && o.owner === G.turn && E.ownsGroup(G, G.turn, c.group) && ['roll', 'end', 'debt'].includes(G.phase)) {
        h += `<div class="act-row">${btn('Продать дом', 'sell', '', !E.canSell(G, G.turn, i), `data-cell="${i}"`)}${btn(`Построить за ${rub(g.house)}`, 'build', 'primary', !E.canBuild(G, G.turn, i) || G.phase === 'debt', `data-cell="${i}"`)}</div>`;
      }
    } else if (c.type === 'transport') {
      h = `<h3>${c.icon} ${esc(c.name)}</h3><p class="sub">Транспорт</p><table class="rent"><tbody>
        ${[1, 2, 3, 4].map(n => `<tr><td>Если у владельца ${n} ${n === 1 ? 'транспорт' : 'транспорта'}</td><td>${rub(RULES.transportRent[n])}</td></tr>`).join('')}
        <tr><td>Цена</td><td>${rub(c.price)}</td></tr><tr><td>Владелец</td><td>${esc(owner)}</td></tr></tbody></table>`;
    } else if (c.type === 'utility') {
      h = `<h3>${c.icon} ${esc(c.name)}</h3><p class="sub">Коммуналка</p><table class="rent"><tbody>
        <tr><td>Одна у владельца</td><td>4 × сумма кубиков</td></tr>
        <tr><td>Обе у владельца</td><td>10 × сумма кубиков</td></tr>
        <tr><td>Цена</td><td>${rub(c.price)}</td></tr><tr><td>Владелец</td><td>${esc(owner)}</td></tr></tbody></table>`;
    } else {
      const about = {
        start: `Каждый раз, когда проходишь Старт или встаёшь на него, получаешь ${rub(RULES.passStart)}.`,
        jail: 'Если попал сюда просто ходом, ты в гостях. Из изолятора выходят дублем, за 50 ₽ или по карте освобождения.',
        parking: 'Праздник Ысыах. Ничего не происходит, отдыхай.',
        gotojail: 'Застрял на зимнике: отправляйся прямо в изолятор, Старт не проходишь.',
        tax: `Заплати банку ${rub(c.amount || 0)}.`,
        bayanai: DECK_ABOUT.bayanai,
        tyusyulge: DECK_ABOUT.tyusyulge,
      }[c.type];
      h = `<h3>${c.icon} ${esc(c.name)}</h3><p>${esc(about)}</p>`;
    }
    h += btn('Закрыть', 'close', 'ghost');
    openSheet(h);
  }

  function showMenu() {
    openSheet(`<h3>Меню</h3>
      ${btn('Правила кратко', 'rules')}
      ${btn('Новая партия', 'askNew')}
      ${btn('Закрыть', 'close', 'ghost')}`);
  }

  function showRules() {
    openSheet(`<h3>Правила кратко</h3>
      <ul class="rules">
        <li>Бросай два кубика и ходи. Дубль даёт ещё один бросок, три дубля подряд ведут в изолятор.</li>
        <li>Встал на свободный участок — можешь купить его.</li>
        <li>На чужом участке платишь аренду. Если у владельца вся группа, аренда пустого участка удваивается.</li>
        <li>Транспорт: 25, 50, 100 или 200 ₽, смотря сколько их у владельца. Коммуналка: 4× или 10× сумма кубиков.</li>
        <li>Строить можно, когда собрана вся группа. Дома ставятся равномерно, до 4, потом отель. Продать дом можно за полцены.</li>
        <li>Проход через Старт: +200 ₽.</li>
        <li>Не хватает денег — продавай дома. Если и это не помогает, ты банкрот. Побеждает последний оставшийся.</li>
        <li>Аукционы, залог и обмен появятся в следующей версии.</li>
      </ul>
      ${btn('Закрыть', 'close', 'ghost')}`);
  }

  function showHandoff() {
    const pl = G.players[G.turn];
    openSheet(`<div class="winner"><p class="sub">Передайте телефон</p>
      <h3 style="color:${pl.color}">${esc(pl.name)}</h3><p>${rub(pl.money)}</p></div>
      ${btn('Мой ход', 'close', 'primary big')}`);
  }

  let toastT = 0;
  function toast(t) {
    const el = $('toast');
    el.textContent = t; el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.hidden = true; }, 2500);
  }

  // ---------- действия ----------
  function send(type, cell) {
    const a = { type, player: G.turn };
    if (cell !== undefined) a.cell = cell;
    const before = G.turn;
    const r = E.act(G, a);
    if (!r.ok) { toast(r.error); return; }
    if (type === 'roll') G.lastRollSeq = G.seq;
    save();
    const sheetWasOpen = !$('sheet').hidden;
    if (sheetWasOpen && (type === 'build' || type === 'sell')) {
      // обновить открытую карточку клетки
      render();
      if (!$('sheet').hidden || sheetWasOpen) showCell(cell);
      return;
    }
    closeSheet();
    render();
    if (G.turn !== before && G.phase !== 'over' && $('sheet').hidden) showHandoff();
  }

  function onClick(e) {
    const t = e.target.closest('[data-act],[data-cell]');
    if (!t) return;
    const act = t.dataset.act;
    const cell = t.dataset.cell !== undefined ? Number(t.dataset.cell) : undefined;
    if (!act && cell !== undefined) { showCell(cell); return; }
    switch (act) {
      case 'close': closeSheet(); return;
      case 'info': showCell(cell); return;
      case 'rules': showRules(); return;
      case 'askNew':
        openSheet(`<h3>Начать новую партию?</h3><p>Текущая партия будет удалена.</p>
          ${btn('Да, новая партия', 'newGame', 'danger')}${btn('Отмена', 'close', 'ghost')}`);
        return;
      case 'newGame': G = null; save(); showSetup(); return;
      default: if (G) send(act, cell);
    }
  }

  // ---------- запуск ----------
  function boot(hot) {
    setup.names = loadNames();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
      if (e.key === 'Escape') closeSheet();
    });
    $('sheet-bg').addEventListener('click', closeSheet);
    $('btn-menu').addEventListener('click', showMenu);
    $('btn-start').addEventListener('click', startGame);
    $('btn-resume').addEventListener('click', () => { G = loadSaved(); if (G) { shownCard = G.card ? G.card.seq : 0; showGame(); } });
    $('count-seg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      readNames(); setup.count = Number(b.dataset.n); renderSetup();
    });
    $('time-seg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      readNames(); setup.minutes = Number(b.dataset.m); renderSetup();
    });
    setInterval(renderTimer, 1000);

    if (hot && hot.G) { G = hot.G; shownCard = G.card ? G.card.seq : 0; showGame(); }
    else renderSetup();
  }

  const h = window.claude && window.claude.hot;
  if (h && h.snapshot) h.snapshot(() => ({ G }));
  if (h && h.ready) h.ready(boot); else boot(h && h.data ? h.data : {});
})();

</script>
</body>
</html>
